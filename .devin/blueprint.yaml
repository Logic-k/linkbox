initialize: |
  true
maintenance: |
  source ~/.nvm/nvm.sh && pnpm install
knowledge:
  - name: lint
    contents: |
      pnpm lint
  - name: typecheck
    contents: |
      pnpm typecheck
  - name: build
    contents: |
      pnpm build
  - name: startup
    contents: |
      source ~/.nvm/nvm.sh && pnpm dev --hostname 0.0.0.0 --port 3000
  - name: notes
    contents: |
      Node/pnpm come from nvm: run `source ~/.nvm/nvm.sh` first in non-interactive shells.
